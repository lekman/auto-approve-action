name: Auto Approve Release Please PR

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'release-please--')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No continue-on-error. With it, this job reported success while the
      # step failed — the token returned 401 Unauthorized from 25 July and no
      # release pull request was approved for weeks, with nothing to show it.
      # This job only runs on release-please branches, so failing loudly here
      # blocks nothing else.
      - name: Auto Approve PR
        id: auto-approve
        uses: ./
        with:
          github-token: ${{ secrets.CODE_OWNER_TOKEN }}
          allowed-authors: "app/lekman-release-please-bot"
          required-labels: "autorelease: pending"
          label-match-mode: "all"
          path-filters: ".github/release-manifest.json,**/CHANGELOG.md,CHANGELOG.md"
